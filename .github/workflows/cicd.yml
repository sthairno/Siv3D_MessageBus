name: CI/CD

on:
  push:
  pull_request:

env:
  PYTHONIOENCODING: utf-8
  USERNAME: ${{ github.repository_owner }}
  FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
  VCPKG_BINARY_SOURCES: clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite

jobs:
  windows-build:
    permissions:
      contents: read
      packages: write
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenSiv3D SDK
        id: install-sdk
        uses: ./.github/actions/install_siv3d_windows
        with:
          download-url: "https://siv3d.jp/downloads/Siv3D/manual/0.6.16/OpenSiv3D_SDK_0.6.16.zip"
          siv3d-env: SIV3D_0_6_16

      - name: Configure NuGet and vcpkg
        shell: pwsh
        run: |
          .$(vcpkg fetch nuget) `
            sources add `
            -Source "${{ env.FEED_URL }}" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "${{ env.USERNAME }}" `
            -Password "${{ secrets.GITHUB_TOKEN }}"
          .$(vcpkg fetch nuget) `
            setapikey "${{ secrets.GITHUB_TOKEN }}" `
            -Source "${{ env.FEED_URL }}"
          vcpkg integrate install

      - name: Install dependencies with vcpkg
        working-directory: Siv3D_MessageBus
        run: vcpkg install --triplet x64-windows-static

      - name: Build Siv3D_MessageBus (Debug)
        working-directory: Siv3D_MessageBus
        run: python3 scripts/build.py Siv3D_MessageBus Debug

      - name: Build Siv3D_MessageBus (Release)
        working-directory: Siv3D_MessageBus
        run: python3 scripts/build.py Siv3D_MessageBus Release

      - name: Install Python dependencies
        working-directory: Siv3D_MessageBus
        run: pip install -r scripts/requirements.txt

      - name: Package distribution
        working-directory: Siv3D_MessageBus
        run: python3 scripts/package.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ github.sha }}
          path: Siv3D_MessageBus/dest/*
          if-no-files-found: error
          retention-days: 1
      
  macos-build:
    permissions:
      contents: read
    runs-on: macos-15-intel
    env:
      # Use local (files) binary cache on macOS, persisted via actions/cache.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg/bincache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg/bincache,readwrite
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure vcpkg environment
        shell: bash
        run: |
          set -euxo pipefail
          echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT}" >> "${GITHUB_ENV}"
          mkdir -p "${GITHUB_WORKSPACE}/.vcpkg/bincache"

      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg/bincache
          key: vcpkg-bincache-${{ runner.os }}-x64-osx-${{ hashFiles('Siv3D_MessageBus/vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-${{ runner.os }}-x64-osx-

      - name: Cache Siv3D SDK (macOS)
        uses: actions/cache@v4
        with:
          path: Siv3D_MessageBus/cmake/siv3d_mac
          key: siv3d-mac-0.6.16

      - name: Install dependencies with vcpkg
        working-directory: Siv3D_MessageBus
        run: vcpkg install --triplet x64-osx

      - name: Build Siv3D_MessageBus (Release)
        working-directory: Siv3D_MessageBus
        run: python3 scripts/build.py Siv3D_MessageBus Release

      - name: Package distribution
        working-directory: Siv3D_MessageBus
        run: python3 scripts/package.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-${{ github.sha }}
          path: Siv3D_MessageBus/dest/*
          if-no-files-found: error
          retention-days: 1

  linux-build-and-test:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and verify Siv3D deb package
        shell: bash
        run: |
          set -euxo pipefail
          curl "https://drive.usercontent.google.com/download?id=1OH0AIiAWX-4136wVmJ9XaqrLi4m8ejR3&confirm=t" -o libsiv3d-dev.deb
          MIME_TYPE=$(file -b --mime-type libsiv3d-dev.deb)
          if [ "$MIME_TYPE" != "application/vnd.debian.binary-package" ]; then
            echo "Unexpected MIME type: ${MIME_TYPE}"
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ./libsiv3d-dev.deb mono-complete libhiredis-dev libgtest-dev

      - name: Configure NuGet and vcpkg
        shell: bash
        run: |
          set -euxo pipefail
          NUGET_EXE_PATH=$(vcpkg fetch nuget | tail -n 1)
          mono "$NUGET_EXE_PATH" \
            sources add \
            -Source "${{ env.FEED_URL }}" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "${{ env.USERNAME }}" \
            -Password "${{ secrets.GITHUB_TOKEN }}"
          mono "$NUGET_EXE_PATH" \
            setapikey "${{ secrets.GITHUB_TOKEN }}" \
            -Source "${{ env.FEED_URL }}"
          vcpkg integrate install

      - name: Build Siv3D_MessageBus (Debug)
        working-directory: Siv3D_MessageBus
        run: python3 scripts/build.py Siv3D_MessageBus Debug

      - name: Build Siv3D_MessageBus (Release)
        working-directory: Siv3D_MessageBus
        run: python3 scripts/build.py Siv3D_MessageBus Release

      - name: Build Test (Debug)
        working-directory: Siv3D_MessageBus
        run: python3 scripts/build.py Test Debug

      - name: Run Test (Debug)
        working-directory: Siv3D_MessageBus
        run: python3 scripts/test.py Debug
        timeout-minutes: 10

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [windows-build, macos-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build-${{ github.sha }}
          path: windows

      - name: Download macOS build artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-build-${{ github.sha }}
          path: macos

      - name: Create package archives
        shell: bash
        run: |
          set -euxo pipefail
          OUTPUT_DIR="$GITHUB_WORKSPACE/_site"
          mkdir -p "$OUTPUT_DIR"
          cd "$GITHUB_WORKSPACE/windows"
          zip -r "$OUTPUT_DIR/Siv3D_MessageBus_Windows.zip" .
          cd "$GITHUB_WORKSPACE/macos"
          zip -r "$OUTPUT_DIR/Siv3D_MessageBus_macOS.zip" .

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
