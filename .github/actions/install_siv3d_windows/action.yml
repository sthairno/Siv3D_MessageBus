name: Install OpenSiv3D Windows SDK
description: Download the OpenSiv3D SDK for Windows from the specified URL and extract it to the target path.

inputs:
  download-url:
    description: URL to download the .zip file
    required: true
  siv3d-env:
    description: Name of the environment variable
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set Installation Path
      id: set-destination-path
      shell: bash
      run: | # zizmor: ignore[github-env] variable name is validated below and the value is derived from runner.temp
        destination_path='${{ runner.temp }}/OpenSiv3D_SDK'

        if [[ ! "${INPUTS_SIV3D_ENV}" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
          echo "Invalid environment variable name: ${INPUTS_SIV3D_ENV}"
          exit 1
        fi

        echo "${INPUTS_SIV3D_ENV}=$destination_path" >> $GITHUB_ENV
        echo "path=$destination_path" >> "$GITHUB_OUTPUT"
      env:
        INPUTS_SIV3D_ENV: ${{ inputs.siv3d-env }}

    - name: Restore Cached SDK
      id: restore-sdk-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.set-destination-path.outputs.path }}
        key: ${{ inputs.siv3d-env }}

    - name: Download SDK Archive
      if: steps.restore-sdk-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -L -o '${{ runner.temp }}/sdk.zip' "${INPUTS_DOWNLOAD_URL}"
      env:
        INPUTS_DOWNLOAD_URL: ${{ inputs.download-url }}

    - name: Extract SDK Files
      if: steps.restore-sdk-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        tmp_zippath='${{ runner.temp }}/sdk.zip'
        tmp_sdkpath=$(echo '${{ runner.temp }}/sdk' | sed 's|\\|/|g') # for cp command
        destination_path="${STEPS_SET_DESTINATION_PATH_OUTPUTS_PATH}"

        unzip -d $tmp_sdkpath $tmp_zippath
        mkdir -p $destination_path
        cp -r $tmp_sdkpath/$(ls $tmp_sdkpath | head -n 1)/* $destination_path
        rm -r $tmp_sdkpath $tmp_zippath

        ls -al $destination_path
      env:
        STEPS_SET_DESTINATION_PATH_OUTPUTS_PATH: ${{ steps.set-destination-path.outputs.path }}
    
    - name: Cache Extracted SDK
      if: steps.restore-sdk-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.set-destination-path.outputs.path }}
        key: ${{ steps.restore-sdk-cache.outputs.cache-primary-key }}
